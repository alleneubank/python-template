[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

# uv installs and manages Python itself (`[tool.uv] managed = true`, .python-version),
# so mise provides no Python. ruff and ty are also dev dependencies in uv.lock;
# `uv run` uses those, while these binaries serve editors and direct invocation.
[tools]
"aqua:astral-sh/uv" = "0.13.5"
"aqua:astral-sh/ruff" = "0.17.2"
"aqua:astral-sh/ty" = "0.0.91"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = "15.2.0"
